<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Est-ce rentable ?</title>
<style>body{font:16px Arial;margin:0;background:#f4f6fa;color:#172033}.w{max-width:850px;margin:auto;padding:25px}h1{font-size:38px}.card{background:white;padding:22px;border-radius:18px;margin:16px 0;box-shadow:0 5px 20px #0001}textarea,input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 12px;border:1px solid #ccd5e2;border-radius:10px;font-size:16px}button{background:#2563eb;color:white;border:0;border-radius:10px;padding:13px 18px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.m{background:#f4f6fa;padding:13px;border-radius:10px}.m b{display:block;font-size:21px;margin-top:5px}.premium{background:#172033;color:white}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style>
<div class=w><h1>💰 Est-ce rentable ?</h1><p>Testez une idée d'investissement en quelques secondes.</p><div class=card><b>Votre idée</b><textarea id=idea rows=4 placeholder="Ex. Acheter un château gonflable pour le louer"></textarea><b>Zone</b><input id=loc value="Liposthey"><b>Budget</b><input id=budget placeholder="Ex. 2 000 €"><button onclick=go()>🔎 Analyser</button></div><div id=out></div></div>
<script>
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function go(){
 const out=document.getElementById("out");
 const idea=document.getElementById("idea").value, location=document.getElementById("loc").value, budget=document.getElementById("budget").value;
 if(!idea.trim()){out.innerHTML='<div class="card orange">⚠️ Décris ton idée.</div>';return}
 out.innerHTML='<div class="card">🔎 Recherche du marché et analyse IA en cours…<br><br>⏳ Cela peut prendre quelques secondes.</div>';
 try{
  const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idea,location,budget})});
  const j=await r.json(); if(!r.ok) throw Error(j.error||"Erreur");
  out.innerHTML='<div class="card"><h2>🤖 Analyse IA</h2><div style="white-space:pre-wrap;line-height:1.6">'+esc(j.text)+'</div></div><div class="card premium"><h2>💎 Étude complète</h2><p>Sources détaillées, concurrence locale, fournisseurs, scénarios et prix maximum d'achat.</p><button>Étude complète — 7,90 €</button></div>';
 }catch(e){out.innerHTML='<div class="card orange">⚠️ '+esc(e.message)+'</div>'}
}
</script>
